<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170" role="img" aria-labelledby="title desc">
  <title id="title">Contact portal animation</title>
  <desc id="desc">A subtle purple portal pulses around the message Ready for the next quest.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#15122b"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="170" rx="18" fill="url(#panel)"/>
  <path d="M42 35h115l16 16-16 16H42L26 51zM743 103h115l16 16-16 16H743l-16-16z"
        fill="none" stroke="#7c3aed" stroke-opacity=".25"/>

  <g transform="translate(450 82)" fill="none" filter="url(#glow)">
    <ellipse rx="310" ry="45" stroke="#7c3aed" stroke-width="2" opacity=".25">
      <animate attributeName="rx" values="285;320;285" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".18;.48;.18" dur="3s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse rx="270" ry="34" stroke="#a78bfa" stroke-width="2" opacity=".55">
      <animate attributeName="rx" values="270;292;270" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".6;.25;.6" dur="2.4s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <rect x="245" y="80" width="410" height="3" rx="2" fill="url(#beam)">
    <animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/>
  </rect>

  <g fill="#c4b5fd">
    <circle cx="185" cy="82" r="4">
      <animate attributeName="cx" values="185;715" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="715" cy="82" r="3">
      <animate attributeName="cx" values="715;185" dur="4s" begin="-2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="-2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="450" y="76" fill="#ffffff" font-size="22" font-weight="700">READY FOR THE NEXT QUEST?</text>
    <text x="450" y="108" fill="#c1c8d6" font-size="14">LET'S BUILD SOMETHING PLAYABLE.</text>
  </g>
</svg>
